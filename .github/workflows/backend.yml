name: Backend

# 自研后端(backend/)的独立验证工作流:只在 backend/ 有改动时跑,不碰 release.yml。
#   test   gofmt 检查、go vet、go test(含 -race)
#   build  交叉编译 linux/amd64、linux/arm64 的静态二进制,作为 Artifact 上传(保留 7 天,仅供下载验证)
# 需要 sing-box 的测试在没有可执行文件时会 t.Skip;后续阶段在这里装好 sing-box 再跑。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Go 版本取自 backend/go.mod;目前没有第三方依赖(没有 go.sum),所以不开缓存
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "下列文件需要 gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      # 测速、校验的测试要真的 sing-box;固定版本,没有它这些测试会被 t.Skip 跳过
      - name: Install sing-box
        working-directory: .
        env:
          SING_BOX_VERSION: '1.14.4'
        run: |
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sb.tgz
          sudo install -m 0755 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version | head -1
      - name: go test
        run: go test -race -count=1 ./...

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=dev-${GITHUB_SHA::7}" \
            -o dist/openbox-backend-linux-${{ matrix.arch }} ./cmd/openbox-backend
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: openbox-backend-linux-${{ matrix.arch }}
          path: backend/dist/
          if-no-files-found: error
          retention-days: 7
