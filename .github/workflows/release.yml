name: Release

# 两种触发方式:
#   1. 推送 v* 标签
#   2. Actions 页面手动运行(Run workflow),填版本号,会在所选分支的最新提交上自动创建该标签
#
# 上游自 v0.1.463 起面板后端是纯 Go 静态二进制,没有可以在这里重新编译的东西。所以发布不再自己打包面板,
# 而是把上游同版本的 release 重新封装(scripts/repack-upstream.py):
#   - 面板、sing-box、mihomo、Geo:上游文件,按上游 components.json 的 sha256 校验后原样使用;
#   - openwrt / debian / 前端 / update.sh / uninstall.sh:把里面的仓库地址换成本仓库;
#   - 组件清单沿用上游 schema:2,只改 app 组件的 sha256 / size。
# 所以版本号必须等于 .upstream-synced(Sync upstream 同步到的上游版本),否则面板二进制和前端、脚本会版本混搭。
# 要发布某个上游版本:先在 catch-up-upstream 上运行 Sync upstream(可指定 tag),再用同一个版本号运行本工作流。
#
# 可选的仓库变量(Settings → Secrets and variables → Actions → Variables):
#   OPENBOX_KERNEL_REPO   上游仓库,默认 liandu2024/Open-Box

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 发布的版本号(必须以 v 开头,且等于 .upstream-synced 里的上游版本,如 v0.1.464);会在所选分支的最新提交上自动创建这个标签
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  OPENBOX_VERSION: ${{ inputs.tag || github.ref_name }}
  OPENBOX_REPO: timeflysoon/Open-Box
  OPENBOX_KERNEL_REPO: ${{ vars.OPENBOX_KERNEL_REPO || 'liandu2024/Open-Box' }}

jobs:
  # 先确认版本号写法、与 .upstream-synced 一致、上游确实有这个 Release;写错了在这里直接停,不浪费后面的构建
  kernel-tag:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "版本号必须以 v 开头并跟数字(如 v0.1.464),收到:$RELEASE_TAG" >&2; exit 1 ;;
          esac
          synced=$(tr -d '\r\n' < .upstream-synced 2>/dev/null || true)
          if [ "$synced" != "$RELEASE_TAG" ]; then
            echo "发布版本 $RELEASE_TAG 与仓库同步到的上游版本「$synced」不一致。" >&2
            echo "纯 Go 面板二进制与上游版本绑定:先在 catch-up-upstream 上运行 Sync upstream(tag 填 $RELEASE_TAG),再发布。" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://github.com/$OPENBOX_KERNEL_REPO/releases/tag/$RELEASE_TAG" || true)
          [ "$code" = 200 ] || { echo "上游 $OPENBOX_KERNEL_REPO 没有 $RELEASE_TAG 的 Release(HTTP $code)" >&2; exit 1; }
          echo "上游版本:$OPENBOX_KERNEL_REPO@$synced"
          echo "tag=$synced" >> "$GITHUB_OUTPUT"

  # 随二进制分发所需的对应源码(GPL):sing-box 必须有;mihomo / Geo 源码取不到只警告
  sources:
    name: Upstream source tarballs
    needs: kernel-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/repack-upstream.py sources kernel-source
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-source
          path: kernel-source/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.arch }})
    needs: kernel-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Build release tarball
        run: bash scripts/build-release.sh ${{ matrix.arch }} dist-release

      # 用包里自带的 Go 程序做它自己的组件校验(路由器上 update.sh 也是这样校验的)。
      # 只在 x64 上能跑;arm64 的二进制在这台 runner 上执行不了,靠 Docker 步骤里的 ELF 架构校验兜底。
      - name: Verify package with its own component-update
        if: matrix.arch == 'x64'
        run: |
          set -eu
          d=$(mktemp -d)
          tar -xzf dist-release/open-box-linux-x64.tar.gz -C "$d"
          "$d/bin/openbox-panel" component-update verify dist-release/open-box-linux-x64-components.json "$d" x64

      # 每个架构产出带版本号与不带版本号两份内容相同的完整包(+sha256),以及分组件包和 components.json;
      # install.sh / update.sh 靠不带版本号的稳定资产名通过 releases/latest/download/<asset> 取最新版。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-box-linux-${{ matrix.arch }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
            dist-release/*components.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, kernel-tag, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
          pattern: open-box-linux-*

      - name: Download corresponding upstream sources
        uses: actions/download-artifact@v4
        with:
          name: kernel-source
          path: dist-release

      # 上游每个 Release 都带着 install.sh / update.sh / uninstall.sh(和各自的 .sha256),
      # 路由器上的更新器会从 Release 下载 update.sh 并校验 sha256;这里取本次提交里的同名脚本,原样附上。
      # (build 步骤已核对过 scripts/update.sh、uninstall.sh 与包里的同名脚本一致)
      - name: Add install / update / uninstall scripts
        run: |
          set -eu
          for s in install update uninstall; do
            test -s "scripts/$s.sh"
            cp "scripts/$s.sh" "dist-release/$s.sh"
            (cd dist-release && sha256sum "$s.sh" > "$s.sh.sha256")
          done

      - name: List release assets
        run: ls -la dist-release

      - name: Compose release notes
        env:
          UPSTREAM_TAG: ${{ needs.kernel-tag.outputs.tag }}
        run: |
          set -eu
          fields=$(tar -xzOf dist-release/open-box-linux-x64.tar.gz meta.json | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          for k in ("singboxVersion", "mihomoVersion", "panelBuildId", "sourceCommit", "geoVersion"):
              print(m.get(k, ""))')
          SINGBOX=$(printf '%s\n' "$fields" | sed -n 1p)
          MIHOMO=$(printf '%s\n' "$fields" | sed -n 2p)
          BUILDID=$(printf '%s\n' "$fields" | sed -n 3p)
          COMMIT=$(printf '%s\n' "$fields" | sed -n 4p)
          GEO=$(printf '%s\n' "$fields" | sed -n 5p)
          {
            echo "## Open-Box ${RELEASE_TAG}"
            echo ""
            echo "本 Release 由上游 \`$OPENBOX_KERNEL_REPO\` 的 \`$UPSTREAM_TAG\` 重新封装:面板、sing-box、mihomo、Geo 与上游逐字节相同(已按上游清单校验 sha256);openwrt、debian、前端、update.sh、uninstall.sh 里的仓库地址换成了本仓库。面板二进制里写死的更新检查地址仍是上游。"
            echo ""
            echo "- 面板:纯静态 Go 程序,无 Node.js 运行时(构建 \`$BUILDID\`,上游源码提交 \`${COMMIT}\`)"
            echo "- sing-box 内核版本:\`$SINGBOX\`(对应源码 \`sing-box-$SINGBOX-source.tar.gz\`,见本 Release 附件)"
            if [ -n "$MIHOMO" ]; then
              echo "- mihomo 内核版本:\`$MIHOMO\`(可选组件,切换到 mihomo 时按需校验下载;对应源码 \`mihomo-$MIHOMO-source.tar.gz\`,见本 Release 附件)"
            fi
            echo "- Geo 规则库提交:\`$GEO\`(JSON 源文件见 \`geodata-$GEO-sources.tar.xz\`)"
            echo ""
            echo "- 完整安装包包含 sing-box 内核与全部 GeoSite / GeoIP 数据,首次启动无需另行下载 Geo 数据。"
            echo "- 升级先校验组件版本及文件,仅下载变化或损坏的组件;路由器上的安装 / 升级脚本全部从本仓库 Release 获取。"
            echo ""
            echo "### 硬件要求"
            echo ""
            echo "- CPU 架构:x86_64 或 arm64(aarch64)"
            echo "- 可用存储:≥ 256MB"
            echo "- 可用内存:≥ 256MB"
            echo "- 系统:OpenWrt"
            echo ""
            echo "### 一键安装"
            echo ""
            echo '```bash'
            echo "# 直连版"
            echo "curl -fsSL https://raw.githubusercontent.com/${OPENBOX_REPO}/catch-up-upstream/scripts/install.sh | sh"
            echo ""
            echo "# 镜像加速版(把 <镜像前缀> 换成你信任的加速站点域名)"
            echo "curl -fsSL https://<镜像前缀>/https://raw.githubusercontent.com/${OPENBOX_REPO}/catch-up-upstream/scripts/install.sh | sh -s -- --mirror <镜像前缀>"
            echo '```'
            echo ""
            echo "完整安装 / 升级 / 卸载说明见仓库根目录 README。"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Open-Box ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-release/*.tar.gz
            dist-release/*.tar.xz
            dist-release/*.sh
            dist-release/*.sha256
            dist-release/*components.json

      # 客户端(安卓 APK / macOS DMG / Windows 安装包 / Linux deb):取上游的成品,原样附到本 Release。
      # 客户端版本和面板版本不同步,也不是每个上游版本都带:每种客户端各自从这个上游版本开始,
      # 往前找最近带它的版本(不取比它更新的);找不到只警告,不让发布失败。
      - name: Attach client apps (Android / macOS / Windows / Linux) from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.kernel-tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p clients
          # 每种客户端的资产名规则(上游命名各不相同:
          # Linux 的 deb 叫 open-box-desktop-linux-<版本>-amd64.deb,不是 open-box-linux-...)
          declare -A pattern=(
            [android]='^open-box-android-.*\.apk(\.sha256)?$'
            [macos]='^open-box-macos-.*\.dmg(\.sha256)?$'
            [windows]='^open-box-windows-.*\.exe(\.sha256)?$'
            [linux]='^open-box-desktop-linux-.*\.deb(\.sha256)?$'
          )
          # 候选版本:这个上游版本,和比它更早的版本(新到旧);比它新的版本不取
          tags=$( { gh release list -R "$OPENBOX_KERNEL_REPO" --limit 20 --json tagName -q '.[].tagName'; echo "$UPSTREAM_TAG"; } \
            | sort -ruV | awk -v t="$UPSTREAM_TAG" '$0==t{p=1} p' )
          for kind in android macos windows linux; do
            found_tag=""; names=""
            for t in $tags; do
              names=$(gh release view "$t" -R "$OPENBOX_KERNEL_REPO" --json assets -q '.assets[].name' \
                | grep -E "${pattern[$kind]}" || true)
              if [ -n "$names" ]; then found_tag=$t; break; fi
            done
            if [ -z "$found_tag" ]; then
              echo "::warning::上游最近的 Release 里都没有 $kind 客户端,本次不附带"
              continue
            fi
            for name in $names; do
              echo "客户端:$name(取自上游 $found_tag)"
              curl -fsSL --retry 3 -o "clients/$name" "https://github.com/$OPENBOX_KERNEL_REPO/releases/download/$found_tag/$name"
              test -s "clients/$name"
              gh release upload "${{ env.RELEASE_TAG }}" "clients/$name" --clobber -R "$GITHUB_REPOSITORY"
            done
          done

  # Docker 镜像:主发布完成之后再单独构建,事后补传到同一个 Release,不拖慢主发布。
  # 镜像只是把本次 release 的完整包装进 alpine(scripts/build-docker.sh,取自上游),不重新编译任何东西;
  # 它会先按 meta.json 和 ELF 头核对包的架构与 panelRuntime。
  # arm64 在 x64 的 runner 上通过 QEMU 构建(只有一步 apk add 要跑目标架构的程序)。
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: [release, kernel-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker sources
        id: chk
        run: |
          if [ -f docker/Dockerfile ] && [ -f scripts/build-docker.sh ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::仓库里没有 docker/ 或 scripts/build-docker.sh,本次不构建 Docker 镜像"
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      # 取本次 build 任务产出的完整发布包(含不带版本号的 open-box-linux-<arch>.tar.gz 和 .sha256)
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.has == 'true'
        with:
          name: open-box-linux-${{ matrix.arch }}
          path: pkg
      - uses: docker/setup-qemu-action@v3
        if: steps.chk.outputs.has == 'true' && matrix.arch == 'arm64'
      - uses: docker/setup-buildx-action@v3
        if: steps.chk.outputs.has == 'true'

      - name: Build image from the release package
        if: steps.chk.outputs.has == 'true'
        run: |
          set -eu
          ver="${RELEASE_TAG#v}"
          sh scripts/build-docker.sh "${{ matrix.arch }}" pkg "open-box:$ver"
          mkdir -p dist-docker
          out="open-box-${RELEASE_TAG}-docker-linux-${{ matrix.arch }}.tar.gz"
          docker save "open-box:$ver" | gzip -9 > "dist-docker/$out"
          (cd dist-docker && sha256sum "$out" > "$out.sha256")
          ls -la dist-docker

      # Compose 部署包(只在 x64 任务里做一份):镜像版本号换成本次版本
      - name: Pack Compose files
        if: steps.chk.outputs.has == 'true' && matrix.arch == 'x64'
        run: |
          set -eu
          ver="${RELEASE_TAG#v}"
          d=open-box-docker
          mkdir -p "$d"
          cp docker/compose.yaml docker/.env.example "$d/"
          sed -i "s#open-box:[0-9][0-9A-Za-z.]*#open-box:$ver#g" "$d/compose.yaml" "$d/.env.example"
          out="open-box-${RELEASE_TAG}-docker-compose.tar.gz"
          tar -czf "dist-docker/$out" "$d"
          (cd dist-docker && sha256sum "$out" > "$out.sha256")

      - name: Upload to the release
        if: steps.chk.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist-docker/* --clobber -R "$GITHUB_REPOSITORY"
